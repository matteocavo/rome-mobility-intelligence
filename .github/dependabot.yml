version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    groups:
      python-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Regular version updates must not widen the validated runtime boundaries.
    # Security alerts/updates stay enabled and require their own review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-minor"]
      - dependency-name: numpy
        update-types: ["version-update:semver-minor"]
      - dependency-name: scipy
        update-types: ["version-update:semver-minor"]
      # Artifact loading requires an exact sklearn version, including patch.
      - dependency-name: scikit-learn
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
