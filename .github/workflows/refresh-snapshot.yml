name: Refresh static last-known-good snapshot
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-static-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fetch, validate, and atomically replace snapshot
        working-directory: frontend
        run: node scripts/refresh-snapshot.mjs
      - name: Create review PR instead of pushing to main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "Matteo Cavo"
          git config user.email "matteo.cavo.data@gmail.com"
          node frontend/scripts/publish-snapshot-pr.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
