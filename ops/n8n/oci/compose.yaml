name: rome-mobility-n8n
services:
  n8n:
    image: n8nio/n8n:2.45.4@sha256:80e23ced901f0e22597d4f3464e3aaf9d835372262ea6f08ef760d8ca35df25c
    platform: linux/arm64
    user: "1000:1000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/node/.cache:rw,nosuid,size=64m,uid=1000,gid=1000
    environment:
      N8N_HOST: ${N8N_HOST:?Set an owned HTTPS DNS hostname}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Europe/Rome
      TZ: Europe/Rome
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: "840"
      EXECUTIONS_TIMEOUT_MAX: "840"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "100"
      N8N_LOG_LEVEL: warn
      N8N_LOG_OUTPUT: console
    secrets: [n8n_encryption_key]
    volumes:
      - type: bind
        source: ${N8N_DATA_DIR:?Set persistent n8n directory}
        target: /home/node/.n8n
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    platform: linux/arm64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    environment:
      N8N_HOST: ${N8N_HOST:?Set an owned HTTPS DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
    ports: ["80:80/tcp", "443:443/tcp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:?Set persistent certificate directory}:/data
      - ${CADDY_CONFIG_DIR:?Set persistent proxy state directory}:/config
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
secrets:
  n8n_encryption_key:
    file: ${N8N_ENCRYPTION_KEY_FILE:?External operator-managed encryption key required}
