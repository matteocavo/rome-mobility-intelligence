[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rome-mobility-intelligence"
version = "1.0.0"
license = {text = "Apache-2.0"}
description = "FastAPI and sklearn foundation for Rome mobility data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "scikit-learn>=1.7,<1.8", "pandas>=2.3,<3",
  "numpy>=2.3,<2.4", "scipy>=1.16,<1.17", "joblib>=1.4,<2", "databricks-sql-connector[pyarrow]>=4,<5",
  "sqlglot>=26,<31",
  "SQLAlchemy>=2.0.55,<2.1", "psycopg[binary]>=3.3.6,<4", "alembic>=1.20.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app.contracts" = ["*.json"]
"app.data" = ["reference/*.json", "reference/maps/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
